<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Libro con pagina animata e orbita cromatica">
<title>Portfolio Ripetizioni</title>
<style>
#motion{transform-origin:32px 49px;animation:page 3.6s cubic-bezier(.3,0,.2,1) infinite}
#orbit{transform-origin:32px 32px;animation:orbit 3.6s linear infinite}
