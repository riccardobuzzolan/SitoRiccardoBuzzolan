<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ripetizioni: pagina del libro che si sfoglia">
<style>
#motion{transform-origin:32px 50px;animation:turn 3.4s cubic-bezier(.34,.02,.2,1) infinite}
#orbit{transform-origin:32px 32px;animation:orbit 7s linear infinite}
@keyframes turn{0%,12%,80%,100%{transform:rotate(0)}40%,55%{transform:rotate(-30deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#motion,#orbit{animation:none}}
</style>
<g id="orbit" fill="none" stroke-width="2.8" stroke-linecap="round"><path d="M8 24C12 12 24 7 35 9" stroke="#F53B94"/><path d="M54 40C51 52 40 58 29 56" stroke="#2177EC"/></g>
<path d="M32 20C25 15 17 14 8 18V48C18 45 26 46 32 51 38 46 46 45 56 48V18C47 14 39 15 32 20Z" fill="#133C52" stroke="#133C52" stroke-width="2" stroke-linejoin="round"/>
<path d="M31 22C24 18 17 18 12 21V43C20 42 27 44 31 47Z" fill="#F6F9FB"/>
<path d="M33 22C40 18 47 18 52 21V43C44 42 37 44 33 47Z" fill="#D6ECF7"/>
<g id="motion"><path d="M32 21C40 15 47 16 53 19V42C45 39 38 42 32 49Z" fill="#55D1D0"/><path d="M38 25c3-1 6-1 9 0M38 31c3-1 6-1 9 0" stroke="#0D5E70" stroke-width="2" stroke-linecap="round" fill="none"/></g>
<path d="M32 20v30" stroke="#082B3D" stroke-width="2.4" fill="none"/>
</svg>