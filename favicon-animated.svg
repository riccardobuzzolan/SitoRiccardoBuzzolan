<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Due messaggi animati si incontrano e generano un'idea"><title>Dialogo — Portfolio Ripetizioni</title><style>
#voice-a{animation:voicea 3.5s cubic-bezier(.16,.82,.23,1) infinite}#voice-b{animation:voiceb 3.5s cubic-bezier(.16,.82,.23,1) infinite}#insight{transform-origin:32px 31px;animation:insight 3.5s cubic-bezier(.16,.82,.23,1) infinite}
@keyframes voicea{0%,10%,100%{transform:translate(-11px,-7px);opacity:.55}43%,82%{transform:translate(0,0);opacity:1}}@keyframes voiceb{0%,10%,100%{transform:translate(11px,7px);opacity:.55}43%,82%{transform:translate(0,0);opacity:1}}@keyframes insight{0%,31%,100%{transform:scale(.1) rotate(-35deg);opacity:0}51%,82%{transform:scale(1) rotate(0deg);opacity:1}}
@media(prefers-reduced-motion:reduce){#voice-a,#voice-b,#insight{animation:none}#insight{opacity:1;transform:scale(1)}}</style>
<rect x="0" y="0" width="64" height="64" rx="10" fill="#FFFFFF"/><g id="voice-a"><path d="M8 10h29c5 0 8 3 8 8v16c0 5-3 8-8 8H23L13 52V42c-3-1-5-4-5-8Z" fill="#0769D7"/></g><g id="voice-b"><path d="M26 25h28c4 0 7 3 7 7v13c0 5-3 8-8 8h-6l-1 8-11-8h-9c-4 0-7-3-7-8V32c0-4 3-7 7-7Z" fill="#FF852A"/></g><g id="insight"><path d="M32 19 35.8 27.5 45 31.5 35.8 35.5 32 44 28.2 35.5 19 31.5 28.2 27.5Z" fill="#FFE03C"/></g></svg>
