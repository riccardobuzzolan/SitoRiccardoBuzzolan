<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Libro con pagina che si sfoglia e pennellata fucsia animata">
<title>Portfolio Ripetizioni · Gesto</title>
<defs><linearGradient id="paintbrush" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FC2D82"/><stop offset=".55" stop-color="#F7359B"/><stop offset="1" stop-color="#38D6EE"/></linearGradient></defs>
<style>
#motion{transform-origin:32px 49px;animation:flip 3.5s cubic-bezier(.38,0,.18,1) infinite}
#swipe{stroke-dasharray:100;animation:brush 3.5s cubic-bezier(.3,0,.2,1) infinite}
@keyframes flip{0%,13%,80%,100%{transform:rotate(0)}38%,60%{transform:rotate(-33deg)}}
@keyframes brush{0%,6%{stroke-dashoffset:100;opacity:.25}46%,79%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-100;opacity:.3}}
@media(prefers-reduced-motion:reduce){#motion,#swipe{animation:none}#swipe{stroke-dashoffset:0;opacity:1}}
</style>
